name: Update GitHub Contribution Heatmap

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-heatmap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test heatmap generator
        run: python -m unittest discover -s scripts/tests -v

      - name: Generate contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python scripts/generate_contribution_heatmap.py

      - name: Commit changed SVG and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/github-contribution-heatmap.svg
          if git diff --cached --quiet; then
            echo 'Heatmap unchanged.'
            exit 0
          fi
          git commit -m 'chore(profile): update contribution heatmap [skip ci]'
          # LeetCode automation can push while this job is fetching data.
          # Rebase unrelated changes; never force-push or overwrite conflicts.
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Push failed after three attempts.' >&2
          exit 1
