name: Update LeetCode Streak

on:
  schedule:
    # Runs at 18:30 UTC (00:00 IST midnight) and 00:30 UTC (06:00 IST) every day
    - cron: '30 18 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LeetCode Stats & Update Card
        run: node scripts/update-leetcode.mjs

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-streak.svg README.md
          if git diff --staged --quiet; then
            echo "No changes detected in LeetCode stats."
          else
            git commit -m "chore(stats): update leetcode streak and calendar stats [skip ci]"
            git push
          fi
